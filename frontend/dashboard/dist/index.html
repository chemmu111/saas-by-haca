    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        overflow: hidden;
        background: #ffffff;
      }

      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }

      #loading-screen.fade-out {
        opacity: 0;
      }

      .loading-container {
        text-align: center;
        animation: fadeIn 0.6s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .logo-wrapper {
        margin-bottom: 48px;
      }

      .logo-square {
        width: 80px;
        height: 80px;
        background: #000000;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        animation: subtlePulse 3s ease-in-out infinite;
      }

      @keyframes subtlePulse {
        0%, 100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.02);
        }
      }

      .logo-text {
        font-family: 'Inter', sans-serif;
        font-size: 28px;
        font-weight: 600;
        color: #ffffff;
        letter-spacing: 1px;
      }

      .brand-name {
        font-family: 'Inter', sans-serif;
        font-size: 32px;
        font-weight: 600;
        color: #000000;
        margin-bottom: 8px;
        letter-spacing: -0.5px;
      }

      .tagline {
        font-size: 14px;
        color: #666666;
        font-weight: 400;
        margin-bottom: 64px;
        letter-spacing: 0.3px;
      }

      .spinner-container {
        position: relative;
        width: 40px;
        height: 40px;
        margin: 0 auto 40px;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 2px solid #f0f0f0;
        border-top-color: #000000;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loading-text {
        font-size: 13px;
        color: #999999;
        font-weight: 400;
        letter-spacing: 0.5px;
        animation: fadeInOut 2s ease-in-out infinite;
      }

      @keyframes fadeInOut {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }

      .progress-line {
        width: 200px;
        height: 1px;
        background: #f0f0f0;
        margin: 32px auto 0;
        position: relative;
        overflow: hidden;
      }

      .progress-fill {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 0%;
        background: #000000;
        animation: progressMove 2s ease-in-out infinite;
      }

      @keyframes progressMove {
        0% {
          width: 0%;
          left: 0%;
        }
        50% {
          width: 40%;
          left: 30%;
        }
        100% {
          width: 0%;
          left: 100%;
        }
      }

      .error-message {
        display: none;
        margin-top: 40px;
        padding: 12px 20px;
        background: #f5f5f5;
        border: 1px solid #e0e0e0;
        color: #666666;
        font-size: 12px;
        max-width: 320px;
      }

      .error-message.show {
        display: block;
        animation: fadeIn 0.4s ease-out;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-C9JPTGEW.js"></script>

  </head>
  <body>
    <div id="loading-screen">
      <div class="loading-container">
        <div class="logo-wrapper">
          <div class="logo-square">
            <div class="logo-text">SX</div>
          </div>
        </div>

        <h1 class="brand-name">Social X</h1>
        <p class="tagline">Social Media Manager</p>

        <div class="spinner-container">
          <div class="spinner"></div>
        </div>

        <div class="loading-text">
          LOADING
        </div>

        <div class="progress-line">
          <div class="progress-fill"></div>
        </div>

        <div class="error-message" id="error-message">
          Taking longer than expected. Check console for errors.
        </div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      console.log('Dashboard HTML loaded');

      setTimeout(function() {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen && loadingScreen.style.display !== 'none') {
          document.getElementById('error-message').classList.add('show');
        }
      }, 10000);

      const observer = new MutationObserver(function(mutations) {
        const root = document.getElementById('root');
        if (root && root.children.length > 0) {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.classList.add('fade-out');
            setTimeout(function() {
              loadingScreen.style.display = 'none';
            }, 500);
          }
          observer.disconnect();
        }
      });

      observer.observe(document.getElementById('root'), {
        childList: true,
        subtree: true
      });
    </script>
  </body>
